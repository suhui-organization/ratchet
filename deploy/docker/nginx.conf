# Ratchet 站点用的 nginx 配置：只做三件事——发静态文件、给探针一个健康端点、
# 把 /verify 这类前端路由回落到对应的 index.html。
#
# 刻意没有的东西：没有 /api 反代（站点没有后端）、没有第三方上游、没有 rewrite 魔法。
# 站点被入侵的可利用面越小越好——这是个讲最小权限的产品。

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 不带服务器版本号
    server_tokens off;

    # ---- 安全基线 ----
    # nginx 的 add_header 是"块内继承、不叠加"：一处 location 自己写了 add_header，
    # 同一块里 server 级的那几条就全部失效。所以安全头集中在一个文件里，
    # 凡是需要额外写 add_header 的 location 都把它 include 进来（见下面）。
    include conf.d/security-headers.inc;

    # ---- 传输与压缩 ----
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;

    # ---- 健康端点（供 K8s 探针用，不落访问日志）----
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok";
    }

    # ---- 缓存策略 ----
    # 构建产物带内容哈希，可以长缓存
    location /_nuxt/ {
        include conf.d/security-headers.inc;
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        try_files $uri =404;
    }
    location /fonts/ {
        include conf.d/security-headers.inc;
        expires 30d;
        add_header Cache-Control "public, immutable" always;
        try_files $uri =404;
    }
    # 页面外壳不能缓存：否则发版后浏览器一直拿旧页面（expires -1 = Cache-Control: no-cache）
    location ~ ^/(index\.html)?$ {
        include conf.d/security-headers.inc;
        expires -1;
        try_files $uri $uri/ /index.html;
    }

    # ---- 前端路由回落 ----
    # nuxt generate 会把 /verify、/pricing、/legal/terms 生成成目录里的 index.html，
    # 所以 $uri/ 必须排在前面；末尾再兜一次根 index.html，避免 404 破面。
    location / {
        include conf.d/security-headers.inc;
        expires -1;
        try_files $uri $uri/ $uri.html /index.html;
    }
}
