# Ratchet 站点用的 nginx 配置：只做三件事——发静态文件、给探针一个健康端点、
# 让 /verify 这类预渲染出来的目录能被不带斜杠地访问。
#
# 刻意没有的东西：没有 /api 反代（站点没有后端）、没有第三方上游、没有 rewrite 魔法。
# 站点被入侵的可利用面越小越好——这是个讲最小权限的产品。
#
# 文件名必须是 default.conf：官方 nginx 镜像自带 /etc/nginx/conf.d/default.conf，
# 主配置按字母序 include conf.d/*.conf，先加载的那个才是 80 端口的默认 server。
# 取名 nginx.conf 的话它排在 default.conf 之后，于是**整套配置静默不生效**——
# 表现是 /healthz 404、server_tokens 也没关掉（实测踩过）。

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 不带服务器版本号
    server_tokens off;

    # ---- 安全基线 ----
    # nginx 的 add_header 是"块内继承、不叠加"：一处 location 自己写了 add_header，
    # 同一块里 server 级的那几条就全部失效。所以安全头集中在一个文件里，
    # 凡是需要额外写 add_header 的 location 都把它 include 进来（见下面）。
    include conf.d/security-headers.inc;

    # ---- 传输与压缩 ----
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;

    # ---- 健康端点（供 K8s 探针用，不落访问日志）----
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok";
    }

    # ---- 缓存策略 ----
    # 首页：不缓存，发版后立刻生效
    location = / {
        include conf.d/security-headers.inc;
        expires -1;
        try_files /index.html =404;
    }

    # 构建产物带内容哈希，可以长缓存
    location /_nuxt/ {
        include conf.d/security-headers.inc;
        # 只用一条 Cache-Control：再叠一个 expires 会同时吐出两条 Cache-Control
        # （max-age=... 与 public, immutable），客户端合并规则各不相同，没必要赌
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }
    location /fonts/ {
        include conf.d/security-headers.inc;
        add_header Cache-Control "public, max-age=2592000, immutable" always;
        try_files $uri =404;
    }

    # ---- 页面 ----
    # nuxt generate 把 /verify、/pricing、/legal/terms 生成成目录里的 index.html。
    # 顺序有讲究：
    #   $uri/index.html 放最前面——直接命中文件，**避免 $uri 命中目录后 nginx 发 301**
    #   （链接里写的是 /verify，301 到 /verify/ 会让页面上每个内链都多一跳）
    #   $uri 用来接 robots.txt、favicon 这类真实文件，$uri.html 接平铺的 html
    # 都不中就 404，交给下面的 error_page 发品牌化的 404 页。这里**故意不回落 index**：
    # 每一页都是预渲染出来的静态文件，回落到首页只会把"页面不存在"藏起来。
    location / {
        include conf.d/security-headers.inc;
        expires -1;
        try_files $uri/index.html $uri $uri.html =404;
    }

    # ---- 404 ----
    # nuxt generate 会产出 404.html；状态码保持 404，只是换一副面孔
    error_page 404 /404.html;
    location = /404.html {
        include conf.d/security-headers.inc;
        expires -1;
    }
}
