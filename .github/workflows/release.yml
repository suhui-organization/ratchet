name: Release

# 打 tag 就在 GitHub 端编译并发布，用户一条命令下载安装：
#   curl -fsSL https://github.com/<owner>/<repo>/releases/latest/download/install.sh | sh
#
# 为什么由 CI 编译而不是让用户装 Go：目标机器上不该有任何构建依赖。
# 用户拿到的是已经编好的二进制，唯一要做的事是校验 sha256（脚本自己会做）。

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write
  # 推 GHCR 需要它；只写 contents 的话镜像会推不上去
  packages: write
  # MCP Registry 的 OIDC 认证需要它（见文末「发布到官方 MCP Registry」那一步）
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # 门禁先跑：编不出、测不过，就不要产出会被别人装到机器上的包
      - name: Go tests
        run: go vet ./... && go test ./...

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Service tests
        working-directory: service
        run: |
          python -m pip install -q pytest
          python -m pytest -q

      # 四平台产物：install.sh 按 uname 挑对应的那一个
      - name: Build all platforms
        run: make dist

      # 把发布地址烧进 install.sh。
      # 用 releases/latest/download 而不是具体 tag：这样脚本不需要知道版本号，
      # 每次发布用户拿到的都是最新版；版本由包名里的版本号体现。
      - name: Assemble release bundle
        run: |
          make release RELEASE_URL="https://github.com/${{ github.repository }}/releases/latest/download"
          # 自检：地址真的写进去了吗（写不进去就是一个 404 的安装命令）
          grep -q "releases/latest/download" dist/release/install.sh
          ls -la dist/release

      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          files: dist/release/*
          generate_release_notes: true
          fail_on_unmatched_files: true

      # 容器镜像：官方 Registry 只认 npm / PyPI / OCI / NuGet / mcpb 这些来源，
      # GitHub Release 不在其列——所以镜像不是"顺便发一个"，而是收录的前置条件。
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=ref,event=tag

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      # 收录前先自证这个镜像真的能当 MCP server 用：
      # 起一次、完成 initialize 握手、退出。握手失败就别指望 Registry 会收。
      - name: Smoke-test the published image
        run: |
          set -euo pipefail
          IMAGE="ghcr.io/${{ github.repository }}:latest"
          OUT=$(printf '%s\n' \
            '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2024-11-05","capabilities":{},"clientInfo":{"name":"ci","version":"1"}}}' \
            | timeout 60 docker run -i --rm "$IMAGE" 2>/dev/null || true)
          echo "$OUT"
          echo "$OUT" | grep -q '"serverInfo"' || { echo "❌ 镜像没有回应 initialize"; exit 1; }
          echo "✅ 镜像能完成 MCP 握手"

      # ── 发布到官方 MCP Registry（OIDC，不需要人工点授权）───────────────────
      # 为什么改成 OIDC：原先是在本地跑 `publisher login github`（设备码 + 几分钟就过期的
      # JWT）。实测两次因为出网抖动把窗口耗掉——一次 registry i/o timeout、一次连接被重置，
      # 白白浪费授权。OIDC 的令牌由 GitHub 现场签发，没有"抢时间"这回事。
      # 于是整条发布链路变成：打 tag → CI 编译 → 推 GHCR → 发 release → 自动重发 Registry。
      - name: Publish to the official MCP Registry
        run: |
          set -euo pipefail

          # 版本必须与本次 tag 一致。不一致时**跳过而不是硬发**：
          # Registry 上挂一个指向不存在镜像的版本，不会有任何东西报错，只会一直错下去。
          TAG="${GITHUB_REF_NAME#v}"
          HAVE=$(python3 -c "import json;print(json.load(open('server.json'))['version'])")
          if [ "$TAG" != "$HAVE" ]; then
            echo "⚠️ server.json 写的是 $HAVE，本次 tag 是 $TAG —— 跳过 Registry 发布（先把 server.json 改到一致再重发）"
            exit 0
          fi

          OS=$(uname -s | tr '[:upper:]' '[:lower:]')
          ARCH=$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/')
          curl -fsSL --retry 5 --retry-all-errors -o /tmp/mcp-publisher.tar.gz \
            "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_${OS}_${ARCH}.tar.gz"
          tar -xzf /tmp/mcp-publisher.tar.gz -C /tmp mcp-publisher

          /tmp/mcp-publisher login github-oidc
          /tmp/mcp-publisher publish
