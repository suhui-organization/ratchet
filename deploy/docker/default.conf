# Ratchet 站点用的 nginx 配置：只做三件事——发静态文件、给探针一个健康端点、
# 让 /verify 这类预渲染出来的目录能被不带斜杠地访问。
#
# 刻意没有的东西：没有 /api 反代（站点没有后端）、没有第三方上游、没有 rewrite 魔法。
# 站点被入侵的可利用面越小越好——这是个讲最小权限的产品。
#
# 文件名必须是 default.conf：官方 nginx 镜像自带 /etc/nginx/conf.d/default.conf，
# 主配置按字母序 include conf.d/*.conf，先加载的那个才是 80 端口的默认 server。
# 取名 nginx.conf 的话它排在 default.conf 之后，于是**整套配置静默不生效**——
# 表现是 /healthz 404、server_tokens 也没关掉（实测踩过）。

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 不带服务器版本号
    server_tokens off;

    # ---- 安全基线 ----
    # nginx 的 add_header 是"块内继承、不叠加"：一处 location 自己写了 add_header，
    # 同一块里 server 级的那几条就全部失效。所以安全头集中在一个文件里，
    # 凡是需要额外写 add_header 的 location 都把它 include 进来（见下面）。
    include conf.d/security-headers.inc;

    # ---- 传输与压缩 ----
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;

    # ---- 健康端点（供 K8s 探针用，不落访问日志）----
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok";
    }

    # ---- 缓存策略 ----
    # 首页：不缓存，发版后立刻生效
    location = / {
        include conf.d/security-headers.inc;
        expires -1;
        try_files /index.html =404;
    }

    # 构建产物带内容哈希，可以长缓存
    location /_nuxt/ {
        include conf.d/security-headers.inc;
        # 只用一条 Cache-Control：再叠一个 expires 会同时吐出两条 Cache-Control
        # （max-age=... 与 public, immutable），客户端合并规则各不相同，没必要赌
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }
    location /fonts/ {
        include conf.d/security-headers.inc;
        add_header Cache-Control "public, max-age=2592000, immutable" always;
        try_files $uri =404;
    }

    # ---- 页面 ----
    # nuxt generate 把 /verify、/pricing、/legal/terms 生成成目录里的 index.html。
    # 顺序有讲究：
    #   $uri/index.html 放最前面——直接命中文件，**避免 $uri 命中目录后 nginx 发 301**
    #   （链接里写的是 /verify，301 到 /verify/ 会让页面上每个内链都多一跳）
    #   $uri 用来接 robots.txt、favicon 这类真实文件，$uri.html 接平铺的 html
    # 都不中就 404，交给 error_page 发品牌化的 404 页。这里**故意不回落 index**：
    # 每一页都是预渲染出来的静态文件，回落到首页只会把"页面不存在"藏起来。
    #
    # 404 指向的是 /not-found 这个**预渲染出来的真实页面**，不是 nitro 顺手生成的
    # 404.html。理由：那份壳是 SPA 兜底，客户端一启动就抛
    # `Cannot read properties of undefined (reading 'app')`，实测页面全白——
    # 静态站点没有 Node 运行时能兜底，所以错误页的身体必须是构建期写好的 HTML。
    # 状态码仍然是 404（error_page 不写 =200 就保留原状态码）。
    location / {
        include conf.d/security-headers.inc;
        expires -1;
        try_files $uri/index.html $uri $uri.html =404;
    }

    # 中文树单独一块，唯一目的是让中文路径下的 404 说中文。
    # /zh 本身（不带尾斜杠）不落在这里，它由上面的 location / 命中 /zh/index.html；
    # 连 404 都要分语言，是因为把中文客户丢到一个英文错误页上，和丢到一个空白页上
    # 差别没那么大——两种都是"没人管我"。
    location /zh/ {
        include conf.d/security-headers.inc;
        expires -1;
        try_files $uri/index.html $uri $uri.html =404;
        error_page 404 /zh/not-found/index.html;
    }

    # ---- nitro 顺手产出的 SPA 兜底壳 ----
    # 200.html / 404.html 在本项目的构建里是坏的（见上）。站点不依赖它们，
    # 也不希望有人照着文件名打开一个空白页，所以直接挡住，让请求走正常 404。
    location ~ ^/(200|404)\.html$ {
        include conf.d/security-headers.inc;
        return 404;
    }

    # ---- 404 ----
    # 所有 404 都用品牌化的错误页，状态码保持 404（error_page 不写 =200 就保留原状态码）。
    # 中文树在 location /zh/ 里覆盖成中文版。
    error_page 404 /not-found/index.html;
}
