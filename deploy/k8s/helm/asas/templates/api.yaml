{{- if .Values.api.persistence.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: asas-data
spec:
  accessModes: ["ReadWriteOnce"]
  {{- if .Values.api.persistence.storageClass }}
  storageClassName: {{ .Values.api.persistence.storageClass }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.api.persistence.size }}
---
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: asas-api
  labels:
    app: asas-api
spec:
  replicas: {{ .Values.api.replicaCount }}
  strategy:
    type: {{ .Values.api.strategy }}
  selector:
    matchLabels:
      app: asas-api
  template:
    metadata:
      labels:
        app: asas-api
    spec:
      {{- with .Values.image.pullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.api.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: {{ printf "%s/%s:%s" (.Values.image.repositoryPrefix | trimSuffix "/") .Values.image.api.repository .Values.image.api.tag | quote }}
          imagePullPolicy: {{ .Values.image.api.pullPolicy }}
          env:
            # 控制台要显示"这是哪一版"。版本从镜像 tag 来，单一事实源，
            # 不在代码里再写一个常量（两处版本号一定会漂）。
            - name: ASAS_VERSION
              value: {{ .Values.image.api.tag | quote }}
          ports:
            - name: http
              containerPort: {{ .Values.api.port }}
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 2
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          {{- if .Values.api.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ .Values.api.persistence.existingClaim | default "asas-data" }}
          {{- else }}
          # 关掉持久化 = 关掉台账。只在"跑通一遍就删"的演示里用。
          emptyDir: {}
          {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: asas-api
  labels:
    app: asas-api
spec:
  type: {{ .Values.api.serviceType }}
  ports:
    - name: http
      port: {{ .Values.api.port }}
      targetPort: http
      {{- if eq .Values.api.serviceType "NodePort" }}
      nodePort: {{ .Values.api.nodePort }}
      {{- end }}
  selector:
    app: asas-api
