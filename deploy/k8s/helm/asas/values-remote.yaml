# 本地集群（192.168.66.8，ns=asas）收敛值。单一事实源：镜像 tag 只写在这里。
image:
  repositoryPrefix: swr.ap-southeast-3.myhuaweicloud.com/digital-finance
  pullSecrets:
    - name: ratchet-swr        # 复用同一个 SWR 组织的拉取密钥
  api:
    tag: "0.1.0-96a0f72"

api:
  replicaCount: 1
  serviceType: NodePort
  nodePort: 30100

# 传感器镜像引用。写在这里是因为这一份文件是"镜像 tag 的单一事实源"。
# 部署时应优先用 digest（同一个 tag 可以被推成另一个镜像，digest 不会；
# 见 docs/DELIVERY-0.16.0.md §3.5）。sensor.enabled 仍然是 false——
# 传感器该跑在有 agent 的那台机器上，集群内定时采集只在节点就是宿主机时成立。
sensor:
  image:
    tag: "0.1.0-96a0f72"
    digest: "sha256:89049ff2ac156fe6d6b44fae7324ecf11d4761b1cd3caff4b1cf8dfb5581e7cd"
