name: Release

# 打 tag 就在 GitHub 端编译并发布，用户一条命令下载安装：
#   curl -fsSL https://github.com/<owner>/<repo>/releases/latest/download/install.sh | sh
#
# 为什么由 CI 编译而不是让用户装 Go：目标机器上不该有任何构建依赖。
# 用户拿到的是已经编好的二进制，唯一要做的事是校验 sha256（脚本自己会做）。

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write
  # 推 GHCR 需要它；只写 contents 的话镜像会推不上去
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # 门禁先跑：编不出、测不过，就不要产出会被别人装到机器上的包
      - name: Go tests
        run: go vet ./... && go test ./...

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Service tests
        working-directory: service
        run: |
          python -m pip install -q pytest
          python -m pytest -q

      # 四平台产物：install.sh 按 uname 挑对应的那一个
      - name: Build all platforms
        run: make dist

      # 把发布地址烧进 install.sh。
      # 用 releases/latest/download 而不是具体 tag：这样脚本不需要知道版本号，
      # 每次发布用户拿到的都是最新版；版本由包名里的版本号体现。
      - name: Assemble release bundle
        run: |
          make release RELEASE_URL="https://github.com/${{ github.repository }}/releases/latest/download"
          # 自检：地址真的写进去了吗（写不进去就是一个 404 的安装命令）
          grep -q "releases/latest/download" dist/release/install.sh
          ls -la dist/release

      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          files: dist/release/*
          generate_release_notes: true
          fail_on_unmatched_files: true

      # 容器镜像：官方 Registry 只认 npm / PyPI / OCI / NuGet / mcpb 这些来源，
      # GitHub Release 不在其列——所以镜像不是"顺便发一个"，而是收录的前置条件。
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=ref,event=tag

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      # 收录前先自证这个镜像真的能当 MCP server 用：
      # 起一次、完成 initialize 握手、退出。握手失败就别指望 Registry 会收。
      - name: Smoke-test the published image
        run: |
          set -euo pipefail
          IMAGE="ghcr.io/${{ github.repository }}:latest"
          OUT=$(printf '%s\n' \
            '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2024-11-05","capabilities":{},"clientInfo":{"name":"ci","version":"1"}}}' \
            | timeout 60 docker run -i --rm "$IMAGE" 2>/dev/null || true)
          echo "$OUT"
          echo "$OUT" | grep -q '"serverInfo"' || { echo "❌ 镜像没有回应 initialize"; exit 1; }
          echo "✅ 镜像能完成 MCP 握手"
