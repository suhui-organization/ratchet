name: Bug
description: Something is broken
title: "[bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        贴之前先跑 `ratchet feedback --kind bug --summary "…"`——它会把路径打码，
        并且告诉你正文里还剩什么。**你决定发什么，工具不替你发。**
  - type: textarea
    id: what
    attributes:
      label: What happened
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: 命令原文最好；**别贴密钥或真实客户路径**
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: ratchet version
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: OS / arch
      placeholder: "linux amd64 / macOS arm64"
    validations:
      required: true
